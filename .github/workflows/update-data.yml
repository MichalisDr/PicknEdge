name: Update data

# Manual only for now (no schedule; a cron is added only when we decide to).
#  - probe = false (default): fetch new finished games, rebuild the clean tables and site/data, run the tests as a
#    guard, commit data/ and site/data/ and start the Pages deploy.
#  - probe = true: re-fetch 5 stored games into a runner temp folder, compare byte-for-byte with data/raw,
#    print MATCH/MISMATCH, commit nothing.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Probe only: re-fetch 5 stored games and compare with data/raw (commits nothing)"
        type: boolean
        default: false

permissions:
  contents: write   # commit the data
  actions: write    # start the Pages deploy workflow

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe (no commit)
        if: ${{ inputs.probe }}
        run: node scripts/fetch/probe.mjs --count 5

      - name: Fetch new games (raw), roster and schedule snapshot
        if: ${{ !inputs.probe }}
        run: node scripts/fetch/run.mjs --concurrency 1

      # The secret is not set: the credits come from the local pull (npm run fantasy:pull), and this step then makes no request.
      # Fantasy credits (private backend, personal token in the repository secret FANTAKING_TOKEN). Without the secret, or with an expired one, this
      # step only prints a warning and writes nothing. continue-on-error: whatever happens here must never stop the games update.
      - name: Fetch Fantasy credits (raw)
        if: ${{ !inputs.probe }}
        continue-on-error: true
        env:
          FANTAKING_TOKEN: ${{ secrets.FANTAKING_TOKEN }}
        run: node scripts/fetch/fantasy.mjs

      - name: Build the clean tables
        if: ${{ !inputs.probe }}
        run: node scripts/build/build.mjs

      # One clear warning (annotation + job summary line) only when the credits are behind the games. Never fails the run:
      # the build and the guard tolerate stale credits (cr, crSeries and valueSeries stop at the last round with credits).
      - name: Fantasy credits status
        if: ${{ !inputs.probe }}
        continue-on-error: true
        run: node scripts/build/fantasy-status.mjs

      - name: Build site/data and docs
        if: ${{ !inputs.probe }}
        run: node scripts/build/site-data.mjs

      # Guard: only the tests that validate the data pipeline output (fetch/clean tables, site/data, data-loader,
      # engine, metrics). UI, theme/CSS, portrait and spec tests are NOT run here: they belong to checks.yml.
      # This job installs no npm packages (the data build does not use sharp).
      - name: "Data tests (guard - nothing is committed if they fail)"
        if: ${{ !inputs.probe }}
        run: >
          node --test
          tests/build/assists.test.mjs
          tests/build/fantasy.test.mjs
          tests/build/names.test.mjs
          tests/build/pbp.test.mjs
          tests/build/pull-fantasy.test.mjs
          tests/core/coverage.test.mjs
          tests/core/data-loader.test.mjs
          tests/metrics/all-metrics.test.mjs
          tests/metrics/eligibility.test.mjs
          tests/metrics/expected-efg.test.mjs
          tests/metrics/registry.test.mjs
          tests/metrics/zones.test.mjs

      - name: Commit changed data
        id: commit
        if: ${{ !inputs.probe }}
        run: |
          git add data site/data
          if git diff --cached --quiet; then
            echo "No new data."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: update games, clean tables and site/data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Start the Pages deploy
        # Only on the default branch: a run on any other branch must never deploy that branch to the live site.
        if: ${{ !inputs.probe && steps.commit.outputs.changed == 'true' && github.ref_name == github.event.repository.default_branch }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${{ github.ref_name }}"
