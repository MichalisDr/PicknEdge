name: Update data

# Manual only for now (no schedule).
#  - probe = false (default): fetch new finished games into data/raw and commit them.
#  - probe = true: re-fetch 5 stored games into a runner temp folder, compare byte-for-byte
#    with data/raw, print MATCH/MISMATCH, commit nothing.
on:
  # TEMPORARY (remove after the run): probe-only on push to this branch.
  push:
    branches: [rebuild/data-pipeline]
  workflow_dispatch:
    inputs:
      probe:
        description: "Probe only: re-fetch 5 stored games and compare with data/raw (commits nothing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe (no commit)
        if: ${{ github.event_name == 'push' || inputs.probe }}
        run: node scripts/fetch/probe.mjs --count 5

      - name: Fetch new games
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.probe }}
        run: node scripts/fetch/run.mjs --concurrency 1

      - name: Commit changed data
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.probe }}
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: update raw games"
            git push
          fi
