# Ανανεώνει τις τιμές Fantasy (credits) και ξαναδημοσιεύει το site όταν αλλάξουν.
name: Τιμές Fantasy

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fantasy-credits
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Λήψη τιμών
        env:
          FANTASY_API_URL: ${{ secrets.FANTASY_API_URL }}
          FANTASY_API_TOKEN: ${{ secrets.FANTASY_API_TOKEN }}
        run: node tools/fetch-fantasy-credits.cjs
      - name: Commit και δημοσίευση αν άλλαξε
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain site/fantasy-credits.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/fantasy-credits.json
            git commit -m "Ενημέρωση τιμών Fantasy"
            git push
            # Τα push με GITHUB_TOKEN δεν ξεκινούν άλλα workflows· τρέχουμε τη δημοσίευση ρητά.
            gh workflow run pages.yml --ref main
          fi
