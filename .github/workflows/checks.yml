name: Fantasy checks

# Full test suite on every pull request (and on pushes to main), so a broken test is caught before merge,
# not at the next data update. The data-update guard runs only the data tests (see update-data.yml).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (sharp is needed by the portraits test)
        run: npm ci
      - name: Full test suite
        run: npm test
