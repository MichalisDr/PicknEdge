<!doctype html>
<html lang="el"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Court Vision · EuroLeague</title>
<style>
:root{color-scheme:dark;--bg:#0b1018;--panel:#111a26;--line:#263242;--muted:#94a3b8;--accent:#b8ee79}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f0f3f6;font:15px/1.6 'Segoe UI',sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{cursor:pointer}a{color:inherit;text-decoration:none}.top{height:82px;padding:0 4%;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:40px}.brand{font-size:21px;font-weight:800;letter-spacing:-1px}.brand span{color:var(--accent)}.top nav{display:flex;align-self:stretch;gap:30px}.top nav a{display:flex;align-items:center;border-bottom:3px solid transparent;color:var(--muted);font-weight:600}.top nav a.active{border-color:var(--accent);color:white}.tag{margin-left:auto;color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 82px)}aside{border-right:1px solid var(--line);padding:30px 18px}aside small,.eyebrow{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--muted)}aside a{display:block;margin:8px 0;padding:12px;border-radius:7px;color:var(--muted)}aside a.active{background:#253327;color:var(--accent)}.aside-note{margin-top:65px;padding:14px;border:1px solid var(--line);font-size:12px;color:var(--muted)}main{padding:38px 4%;min-width:0;max-width:1600px;width:100%;margin:auto}h1{font-size:clamp(28px,3.2vw,46px);letter-spacing:-1.5px;line-height:1.15;margin:10px 0 15px}h2{font-size:21px;line-height:1.3;margin:10px 0}h3{font-size:16px}p{color:var(--muted)}.intro{max-width:760px}.hero{display:flex;justify-content:space-between;align-items:start;gap:25px;margin-bottom:30px}.pill{border:1px solid var(--line);padding:6px 12px;border-radius:30px;font-size:12px;white-space:nowrap;color:var(--accent)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:var(--panel);border:1px solid var(--line);padding:26px;border-radius:12px}.action{position:relative;min-height:260px;display:flex;flex-direction:column;align-items:start}.number{font-size:12px;color:var(--accent);letter-spacing:2px}.action p{max-width:440px}.action a{margin-top:auto;color:var(--accent);font-weight:600}.section-head{display:flex;justify-content:space-between;align-items:center;margin:32px 0 15px}.muted{color:var(--muted);font-size:13px}.btn{display:inline-block;border:1px solid var(--line);border-radius:7px;background:#1b2837;color:white;padding:10px 16px}.btn.primary{background:var(--accent);color:#15200e;border:0;font-weight:700}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.empty{padding:30px;border:1px dashed #354255;border-radius:10px;color:var(--muted)}label{display:block;font-size:13px;color:var(--muted)}input,select,textarea{display:block;width:100%;margin-top:6px;background:#0b121c;border:1px solid #354255;border-radius:6px;padding:11px;color:white}textarea{min-height:90px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.wide{grid-column:1/-1}.notice{border-left:3px solid var(--accent);padding:12px 18px;background:#17221b;color:#c5d4c5;font-size:13px;margin:20px 0}.analysis{margin-top:20px}.metric{font-size:30px;color:var(--accent)}.saved{margin-top:12px}.saved p{white-space:pre-wrap;overflow-wrap:anywhere}iframe{border:1px solid var(--line);width:100%;height:1100px;background:#0c1220;border-radius:12px}.footer{margin-top:35px;border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:12px}[hidden]{display:none!important}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);padding:10px 4%;display:flex;gap:8px;overflow:auto}aside small,.aside-note{display:none}aside a{white-space:nowrap;font-size:13px;margin:0}main{padding:25px 4%}.hero{flex-direction:column}.top{gap:22px}.tag{display:none}.grid{grid-template-columns:1fr}}@media(max-width:480px){.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.top{gap:20px;padding:0 5%;height:70px}.brand{font-size:17px}.top nav{gap:18px}.card{padding:20px}}
</style><link rel="stylesheet" href="betting-stats.css?v=20261029-betting1"><script src="betting-team-data.js"></script><script src="betting-games-seed.js?v=20261029-betting1"></script><script src="betting-players-seed.js?v=20261030-live1"></script><script src="betting-live-data.js?v=20261030-live1"></script><link rel="stylesheet" href="team-history.css?v=20261029-betting1"><script src="team-history.js?v=20261029-betting1"></script><script src="betting-stats.js?v=20261029-betting1"></script><link rel="stylesheet" href="betting-schedule.css?v=20261029-betting1"><script src="betting-schedule.js?v=20261029-betting1"></script><link rel="stylesheet" href="betting-players.css?v=20261029-betting1"><script src="betting-players.js?v=20261029-betting1"></script><link rel="stylesheet" href="fantasy-stats.css?v=20261030-live1"><script src="fantasy-data.js?v=20261029-cards2"></script><script src="period-data.js"></script><script src="fantasy-period-data.js?v=20261029-cards2"></script><script src="fantasy-matchup-data.js?v=20261029-matchup2"></script><script src="fantasy-live.js?v=20261030-live1"></script><link rel="stylesheet" href="fantasy-credits.css?v=20261031-cr1"><script src="fantasy-credits.js?v=20261031-cr1"></script><script src="fantasy-stats.js?v=20261031-cr1"></script><link rel="stylesheet" href="fantasy-orange.css?v=20261029-cards2"></head><body>
<header class="top"><a class="brand" href="#fantasy">COURT<span>VISION</span></a><nav aria-label="Κύριες περιοχές"><a data-area="fantasy" href="#fantasy">Fantasy</a><a data-area="betting" href="#betting">Betting</a></nav><span class="tag">EUROLEAGUE / ANALYSIS PLATFORM</span></header>
<div class="layout"><aside id="sidebar"></aside><main id="content"></main></div>
<script>
const content=document.querySelector('#content');let current='';let records=[];let storageOK=true;try{records=JSON.parse(localStorage.getItem('courtvision-analyses-v1')||'[]');if(!Array.isArray(records))records=[]}catch{storageOK=false}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const intro=(k,t,d,b='WORKSPACE / V1')=>`<div class="hero"><div class="intro"><div class="eyebrow">${k}</div><h1>${t}</h1><p>${d}</p></div><span class="pill">${b}</span></div>`;
const footer='<div class="footer">Court Vision · EuroLeague research workspace. Τα στατιστικά διατηρούν την κάλυψη και τις πηγές του υπάρχοντος dashboard. Πρόγραμμα, στατιστικά ομάδων και παικτών: live από την EuroLeague. Δεν υπάρχει σύνδεση με αποδόσεις.</div>';
function render(){current=location.hash.slice(1)||'fantasy';if(!['fantasy','credits','data','betting','schedule','manual','saved'].includes(current))current='fantasy';const area=['fantasy','credits'].includes(current)?'fantasy':'betting';document.querySelectorAll('[data-area]').forEach(a=>a.classList.toggle('active',a.dataset.area===area));const links=area==='fantasy'?[['fantasy','Fantasy dashboard'],['credits','CR & Value']]:[['betting','Επισκόπηση'],['schedule','Βάσει προγράμματος'],['manual','Χειροκίνητη ανάλυση'],['saved','Αποθηκευμένες αναλύσεις'],['data','Στατιστικά Betting']];document.querySelector('#sidebar').innerHTML='<small>WORKSPACE</small>'+links.map(([id,t])=>`<a href="#${id}" class="${current===id?'active':''}" ${current===id?'aria-current="page"':''}>${t}</a>`).join('')+'<div class="aside-note">Μία βάση δεδομένων.<br>Δύο τρόποι ανάλυσης.<br><br>Από την παρατήρηση στην τεκμηρίωση.</div>';
if(current==='data'){BettingStats.mount(content);return}
if(current==='credits'){FantasyCredits.mount(content);return}
if(current==='fantasy'){FantasyStats.mount(content);return}
if(current==='betting'){content.innerHTML=intro('BETTING / RESEARCH','Κάθε σημείο ξεκινά από μία υπόθεση.','Ξεκίνα από τα παιχνίδια της αγωνιστικής ή από ένα σημείο που θέλεις να εξετάσεις. Οι δύο διαδρομές καταλήγουν στην ίδια κάρτα ανάλυσης.')+`<div class="grid"><section class="card action"><span class="number">01 / DISCOVER</span><h2>Βάσει προγράμματος</h2><p>Παιχνίδι → αδυναμία ομάδας → πιθανός ωφελημένος παίκτης → υπόθεση προς διερεύνηση.</p><a href="#schedule">Εξερεύνηση matchups ↗</a></section><section class="card action"><span class="number">02 / INVESTIGATE</span><h2>Έχεις ήδη ένα σημείο;</h2><p>Όρισε παίκτη, αγορά, γραμμή και απόδοση. Κατέγραψε την τεκμηρίωση και όσα χρειάζονται έλεγχο.</p><a href="#manual">Νέα χειροκίνητη ανάλυση ↗</a></section></div><div class="section-head"><h2>Το αρχείο έρευνάς σου</h2><a class="btn" href="#saved">${records.length} αποθηκευμένες →</a></div><div class="notice">Οι υποθέσεις δεν αποτελούν προβλέψεις. Η αυτοματοποιημένη ανίχνευση ευκαιριών και η ανάγνωση αποδόσεων αποτελούν επόμενη φάση.</div>`+footer;return}
if(current==='schedule'&&window.BettingSchedule){BettingSchedule.mount(content);return}
if(current==='schedule'){content.innerHTML=intro('BETTING / DISCOVER','Από το matchup στην υπόθεση.','Ο χώρος για την εβδομαδιαία ανάγνωση του προγράμματος, τις αδυναμίες των ομάδων και τους παίκτες που αξίζει να εξεταστούν.')+`<div class="empty"><h2>Το πρόγραμμα δεν έχει συνδεθεί ακόμη.</h2><p>Για την αυτόματη λίστα παιχνιδιών χρειάζεται πηγή προγράμματος και αντιστοίχιση με τα δεδομένα ομάδων και παικτών.</p><a class="btn" href="#data">Άνοιγμα στατιστικών</a></div><div class="section-head"><h2>Πώς θα διαβάζουμε κάθε παιχνίδι</h2><span class="muted">Παράδειγμα διαδικασίας</span></div><div class="grid"><div class="card"><span class="number">ΠΑΡΑΔΕΙΓΜΑ · ΟΧΙ ΤΡΕΧΟΝ ΕΥΡΗΜΑ</span><h2>Αμυντικό ριμπάουντ → αντίπαλοι ψηλοί</h2><p>Εάν τα δεδομένα δείξουν χαμηλό DREB% της Virtus, εξετάζουμε την ευκαιρία για επιθετικά ριμπάουντ των αντίπαλων ψηλών.</p><button class="btn primary" id="hypothesis">Διερεύνηση υπόθεσης →</button></div><div class="card"><h2>Οι έλεγχοι πριν από το συμπέρασμα</h2><p>Μέγεθος δείγματος και πρόσφατη τάση.<br>Λεπτά, ρόλος και διαθεσιμότητα.<br>Αντίπαλος και πιθανό αγωνιστικό σχήμα.<br>Διαθέσιμη αγορά, γραμμή και απόδοση.</p></div></div>`+footer;document.querySelector('#hypothesis').onclick=()=>{sessionStorage.setItem('cv-hypothesis','Εξέταση επιθετικών ριμπάουντ αντίπαλων ψηλών εάν επιβεβαιωθεί αδυναμία της Virtus στο DREB%.');location.hash='manual'};return}
if(current==='manual'){content.innerHTML=intro('BETTING / INVESTIGATE','Βάλε το σημείο στο μικροσκόπιο.','Δημιούργησε μία κάρτα έρευνας. Η απόδοση δίνει το όριο ισοσκέλισης· η εκτίμηση πιθανότητας απαιτεί ξεχωριστή τεκμηρίωση.')+`<form id="analysis-form" class="card"><div class="formgrid"><label>Παίκτης<input name="player" required placeholder="π.χ. Zach LeDay" maxlength="120"></label><label>Αντίπαλος<input name="opponent" required placeholder="π.χ. Virtus Bologna" maxlength="120"></label><label>Αγορά<select name="market"><option>Επιθετικά ριμπάουντ</option><option>Συνολικά ριμπάουντ</option><option>Πόντοι</option><option>Ασίστ</option><option>PRA</option></select></label><label>Κατεύθυνση<select name="direction"><option>Over</option><option>Under</option></select></label><label>Γραμμή<input name="line" required type="number" min="0" step="0.5" placeholder="1.5"></label><label>Δεκαδική απόδοση<input name="odds" required type="number" min="1.01" step="0.01" placeholder="2.05"></label><label>Ημερομηνία παιχνιδιού<input name="date" type="date"></label><label>Πηγή απόδοσης<input name="source" maxlength="160" placeholder="Στοιχηματική / ώρα καταγραφής"></label><label class="wide">Υπόθεση και υποστηρικτικά δεδομένα<textarea name="evidence" maxlength="6000" placeholder="Εύρημα, δείγμα παιχνιδιών, πηγή και ημερομηνία…"></textarea></label><label class="wide">Αβεβαιότητες και έλεγχοι που εκκρεμούν<textarea name="uncertainty" maxlength="4000" placeholder="Λεπτά, απουσίες, αλλαγές rotation, ελλιπή game logs…"></textarea></label></div><p><button class="btn primary" type="submit">Δημιουργία κάρτας ανάλυσης →</button></p></form><div id="result" aria-live="polite"></div>`+footer;try{document.querySelector('[name=evidence]').value=sessionStorage.getItem('cv-hypothesis')||'';sessionStorage.removeItem('cv-hypothesis')}catch{}document.querySelector('form').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));data.id=crypto.randomUUID();document.querySelector('#result').innerHTML=card(data)+`<p><button id="save" class="btn primary">Αποθήκευση ανάλυσης</button></p><p id="save-status" role="status"></p>`;document.querySelector('#save').onclick=()=>{try{localStorage.setItem('courtvision-analyses-v1',JSON.stringify([...records,data]));records.push(data);document.querySelector('#save').disabled=true;document.querySelector('#save-status').textContent='Αποθηκεύτηκε σε αυτόν τον browser.'}catch{document.querySelector('#save-status').textContent='Η αποθήκευση δεν είναι διαθέσιμη σε αυτόν τον browser.'}};document.querySelector('#result').scrollIntoView({behavior:'smooth',block:'start'})};return}
content.innerHTML=intro('BETTING / LIBRARY','Το αρχείο των υποθέσεών σου.','Οι κάρτες αποθηκεύονται σε αυτόν τον browser. Εξήγαγε το αρχείο για να κρατήσεις αντίγραφο.')+`<div class="row"><a class="btn primary" href="#manual">Νέα ανάλυση +</a><button class="btn" id="export" ${records.length?'':'disabled'}>Εξαγωγή JSON</button></div>`+(records.length?records.map(card).join(''):'<p class="empty">Δεν υπάρχουν ακόμη αποθηκευμένες αναλύσεις.</p>')+footer;document.querySelector('#export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(records,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='court-vision-analyses.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
}
function card(d){return `<article class="card analysis"><div class="eyebrow">ΚΑΡΤΑ ΑΝΑΛΥΣΗΣ / ΥΠΟΘΕΣΗ ΠΡΟΣ ΕΛΕΓΧΟ</div><h2>${esc(d.player)} · ${esc(d.direction)} ${esc(d.line)} ${esc(d.market)}</h2><p>vs ${esc(d.opponent)} ${d.date?' · '+esc(d.date):''} · Απόδοση ${esc(d.odds)}</p><div class="grid"><div><span class="muted">Όριο ισοσκέλισης στην απόδοση</span><div class="metric">${(100/Number(d.odds)).toFixed(1)}%</div><span class="muted">1 / απόδοση · χωρίς προσαρμογή γκανιότας</span></div><div><span class="muted">Εκτίμηση επιβεβαίωσης</span><h2>Δεν έχει υπολογιστεί</h2><span class="muted">Δεν υπάρχει ακόμη επικυρωμένο μοντέλο.</span></div></div><div class="saved"><h3>Υπόθεση & δεδομένα</h3><p>${esc(d.evidence||'Δεν καταγράφηκαν ακόμη.')}</p><h3>Αβεβαιότητες</h3><p>${esc(d.uncertainty||'Δεν έχουν καταγραφεί — απαιτείται έλεγχος.')}</p><p class="muted">Πηγή απόδοσης: ${esc(d.source||'Δεν δηλώθηκε')}</p></div></article>`}
window.addEventListener('hashchange',render);render();
</script></body></html>
