(()=>{
const root=document.getElementById('milan-defense'),{teams,averages,names,coords}=DATA;
let selected=teams.find(t=>t.id==='panathinaikos'),mode='fg';
const fmt=v=>v===null?'—':v.toFixed(1).replace('.',',');
const ordinal=n=>n+((n%100>=11&&n%100<=13)?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th'));
const rank=(t,index)=>1+teams.filter(o=>index===-1?o.pace>t.pace:([2,3].includes(index)?o.stats[index]>t.stats[index]:o.stats[index]<t.stats[index])).length;
const nav=document.createElement('div');nav.style.cssText='display:flex;flex-wrap:wrap;gap:3px;padding:12px 14px';nav.setAttribute('aria-label','Ομάδα');
teams.forEach(t=>{const b=document.createElement('button');b.textContent=t.label;b.type='button';b.dataset.team=t.id;b.addEventListener('click',()=>{selected=t;render();save()});nav.append(b)});root.prepend(nav);
const svg=root.querySelector('.court');svg.setAttribute('viewBox','0 0 440 312');root.querySelector('.lines path').setAttribute('d','M16 307V16H424V307Z');
const meanOf=a=>a.reduce((s,v)=>s+v,0)/a.length;
const sdOf=(a,m)=>Math.sqrt(meanOf(a.map(v=>(v-m)**2)));
const metrics=Array.from({length:6},(_,i)=>{const a=teams.map(t=>t.stats[i]),m=meanOf(a);return {mean:m,sd:sdOf(a,m)}});
function shade(z){return z < -1 ? '#ff5268' : z < -.5 ? '#ff9947' : z <= .5 ? '#f5d547' : z <= 1 ? '#65bba6' : '#25ed86'}
const distributions=Object.fromEntries(['fg','assisted','unassisted'].map(m=>[m,coords.map((_,i)=>{const a=teams.filter(t=>t.attempts[i]>0).map(t=>t[m][i]);return sdOf(a,meanOf(a))})]));
function render(){const t=selected;root.querySelector(".head").style.borderTopColor=t.color;root.querySelector('h2').textContent=t.name;const badge=root.querySelector('.monogram');badge.removeAttribute('aria-label');badge.replaceChildren();const logo=document.createElement('img');logo.src=t.logo;logo.alt=t.label;logo.width=48;logo.height=48;badge.append(logo);root.querySelector('.head .sub').textContent='Last 5 · Games '+t.games+' · Matching shooting sample ('+t.shotGames+' games)';root.querySelector('.pace strong').innerHTML=fmt(t.pace)+' <span style="font-size:12px;color:#acb8cc">('+ordinal(rank(t,-1))+')</span>';
root.querySelectorAll('.stat .value').forEach((v,i)=>{v.innerHTML=fmt(t.stats[i])+([1,2,3,5].includes(i)?'<span>%</span>':'')+' <span style="font-size:12px">('+ordinal(rank(t,i))+')</span>';v.style.fontSize='22px';const color=shade((t.stats[i]-metrics[i].mean)/(metrics[i].sd||1)*([2,3].includes(i)?-1:1));v.style.color=color;v.querySelectorAll('span').forEach(el=>el.style.color='inherit')});
root.querySelectorAll('[data-team]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.team===t.id)));root.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));
root.querySelector('.mode-label').textContent=mode==='fg'?'Ευστοχία αντιπάλων · FG%':mode==='assisted'?'Καλάθια από ασίστ · ανά 100 κατοχές':'Καλάθια χωρίς ασίστ · ανά 100 κατοχές';root.querySelector('.attempts').hidden=mode!=='fg';root.querySelectorAll('.attempts strong').forEach((v,i)=>v.textContent=fmt(t.fga[i]));
svg.setAttribute('aria-label',t.name+' '+mode);const maxVolume=Math.max(...teams.flatMap(o=>o.volume));root.querySelector('.spots').innerHTML=coords.map(([x,y],i)=>{const val=t[mode][i],mean=averages[mode][i],z=(val-mean)/(distributions[mode][i]||1);const color=t.attempts[i]===0?'#8794aa':shade(z);const label=val===null?'—':mode==='fg'?Math.round(val)+'%':fmt(val);const r=32*Math.sqrt(t.volume[i]/maxVolume);const detail=t.made[i]+'/'+t.attempts[i];const marker=mode==='fg'&&t.attempts[i]>=30?(z>1?'🚩':z < -1?'🛡️':''):'';const markerLabel=z>1?'Αδυναμία':'Δυνατό σημείο';return `<g class="spot" transform="translate(${x},${y})"><circle r="${r}" style="fill:${color};fill-opacity:.2;stroke:none"/><foreignObject x="-22" y="-22" width="44" height="44"><button xmlns="http://www.w3.org/1999/xhtml" type="button" data-tooltip="${detail}" aria-label="${detail}" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;min-height:44px;padding:0;color:${color};font-size:14px;background:transparent;border:0">${label}</button></foreignObject>${marker?`<foreignObject x="10" y="-26" width="24" height="24"><span xmlns="http://www.w3.org/1999/xhtml" role="img" aria-label="${markerLabel}" style="font-size:15px;line-height:24px;pointer-events:none">${marker}</span></foreignObject>`:""}</g>`}).join('')}

function save(){}
root.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;render();save()}));
function restore(s){selected=teams.find(t=>t.id===s?.team)||selected;mode=['fg','assisted','unassisted'].includes(s?.shootingMode)?s.shootingMode:mode;render()}
restore(window.openai?.widgetState?.modelContent);window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState.modelContent)});
})();

</script>
